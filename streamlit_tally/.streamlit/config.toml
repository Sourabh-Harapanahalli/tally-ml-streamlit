# Look and feel for Tally AI. The detailed styling lives in ui.py; this sets
# the base colours Streamlit's own widgets use so they match it.
[theme]
base = "light"
primaryColor = "#5b5fd6"
backgroundColor = "#f8f9fb"
secondaryBackgroundColor = "#f2f3f7"
textColor = "#1c2033"
font = "sans serif"

[client]
# Hide the developer menu and "Deploy" button from everyday users.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
